name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Example vault
        run: python3 tools/validate_vault.py examples/low-oriole-metering --example
      - name: Quickstart drill
        run: python3 tools/quickstart_drill.py
